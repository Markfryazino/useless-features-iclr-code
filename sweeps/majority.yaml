method: grid
program: train.py
parameters:
    seed:
        min: 0
        max: 9
    world:
        value: maj

    model.hidden_dim:
        value: 128
    model.n_head:
        value: 4
    model.split_index:
        values: [null, 10]
    model.myopic:
        values: [false, true]

    train_dataset_size:
        value: 102400
    eval_dataset_size:
        value: 10240
    deduplication_size:
        value: 10
    dataset_path:
        value: data/majority

    num_steps:
